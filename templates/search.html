<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Blood Donor - BloodConnect</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .navbar {
            background: #b91c1c;
            color: white;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #b91c1c;
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        select {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 14px 25px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #991b1b;
        }

        #results {
            margin-top: 30px;
        }

        .donor-card {
            padding: 20px;
            margin-top: 15px;
            border-left: 5px solid #b91c1c;
            background: #f9fafb;
            border-radius: 8px;
        }

        .donor-card h3 {
            margin-top: 0;
            color: #b91c1c;
        }

        .message {
            text-align: center;
            padding: 20px;
            color: #555;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            🩸 BloodConnect
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/register">Register</a>
            <a href="/scan">Scan Face</a>
        </div>

    </nav>


    <!-- Search Section -->
    <div class="container">

        <h1>🩸 Search Blood Donor</h1>

        <p style="text-align:center;">
            Select the required blood group to find registered donors.
        </p>

        <div class="search-box">

            <select id="blood_group">

                <option value="">Select Blood Group</option>

                <option value="A+">A+</option>
                <option value="A-">A-</option>

                <option value="B+">B+</option>
                <option value="B-">B-</option>

                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>

                <option value="O+">O+</option>
                <option value="O-">O-</option>

            </select>

            <button onclick="searchDonors()">
                Search Donors
            </button>

        </div>


        <!-- Results will appear here -->

        <div id="results"></div>

    </div>


    <script>

       function searchDonors() {

    const bloodGroup = document.getElementById("blood_group").value;
    const results = document.getElementById("results");

    if (!bloodGroup) {
        results.innerHTML =
            '<div class="message">Please select a blood group.</div>';
        return;
    }

    results.innerHTML =
        '<div class="message">Searching donors...</div>';

    const params = new URLSearchParams();
    params.append("blood_group", bloodGroup);

    fetch("/search_donors?" + params.toString())
        .then(response => response.json())
        .then(data => {

            if (!data.success) {
                results.innerHTML =
                    '<div class="message">' +
                    data.message +
                    '</div>';
                return;
            }

            results.innerHTML = "";

            data.donors.forEach(donor => {

                const card = document.createElement("div");

                card.className = "donor-card";

                card.innerHTML = `
                    <h3>🩸 ${donor.name}</h3>

                    <p>
                        <strong>Phone:</strong>
                        ${donor.phone}
                    </p>

                    <p>
                        <strong>Blood Group:</strong>
                        ${donor.blood_group}
                    </p>
                `;

                results.appendChild(card);
            });
        })
        .catch(error => {

            console.error("Search error:", error);

            results.innerHTML =
                '<div class="message">' +
                'Error while searching donors.' +
                '</div>';
        });
}

    </script>

</body>

</html>
